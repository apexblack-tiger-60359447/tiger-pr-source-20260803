name: g01-runtime-token-boundary-v2

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create and upload owned artifact
        run: |
          mkdir -p own
          printf '%s\n' 'G01_RUNTIME_V2_SELF_SENTINEL_20260803_N4Q8' > own/sentinel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g01-runtime-v2-self-20260803-n4q8
          path: own/sentinel.txt
      - name: Probe results service and API token consumers
        env:
          FOREIGN_OWNER: apexblkw-ow-2lt415yust
          FOREIGN_REPO: g01-private-control-20260803
          FOREIGN_RUN: '30854116091'
          FOREIGN_ARTIFACT: '8871751823'
        run: |
          set +e
          for n in ACTIONS_RUNTIME_URL ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL; do
            v="${!n}"
            host=$(printf '%s' "$v" | sed 's#https://##;s#/.*##')
            echo "env=$n present=$([ -n "$v" ] && echo yes || echo no) length=${#v} host=$host"
          done
          base="${ACTIONS_RESULTS_URL:-${ACTIONS_RUNTIME_URL:-}}"
          base="${base%/}"
          echo "results_base_present=$([ -n "$base" ] && echo yes || echo no)"

          if [ -n "$base" ] && [ -n "$ACTIONS_RUNTIME_TOKEN" ]; then
            for run in "$GITHUB_RUN_ID" "$FOREIGN_RUN"; do
              body=$(mktemp)
              url="$base/_apis/pipelines/workflows/$run/artifacts?api-version=6.0-preview"
              code=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "$url")
              echo "runtime_artifacts run=$run status=$code bytes=$(wc -c < "$body")"
              grep -aoE 'G01_RUNTIME_V2_SELF_SENTINEL|G01_PRIVATE_ARTIFACT_SENTINEL|8871751823|g01-runtime-v2-self' "$body" | head -20 || true
              rm -f "$body"
            done
            for path in \
              "/_apis/pipelines/artifacts/$FOREIGN_ARTIFACT?api-version=6.0-preview" \
              "/_apis/Artifacts/$FOREIGN_ARTIFACT" \
              "/_apis/pipelines/workflows/$FOREIGN_RUN/artifacts/$FOREIGN_ARTIFACT?api-version=6.0-preview"; do
              body=$(mktemp)
              code=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "$base$path")
              echo "runtime_foreign_path=$path status=$code bytes=$(wc -c < "$body")"
              grep -aoE 'G01_PRIVATE_ARTIFACT_SENTINEL|8871751823|secret.txt|not found|forbidden' "$body" | head -20 || true
              rm -f "$body"
            done
          fi

          for url in \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            "https://api.github.com/repos/$FOREIGN_OWNER/$FOREIGN_REPO/actions/artifacts/$FOREIGN_ARTIFACT" \
            "https://api.github.com/repos/$FOREIGN_OWNER/$FOREIGN_REPO/actions/artifacts/$FOREIGN_ARTIFACT/zip"; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "$url")
            echo "github_api_url=$url status=$code bytes=$(wc -c < "$body")"
            grep -aoE 'G01_PRIVATE_ARTIFACT_SENTINEL|8871751823|g01-runtime-v2-self-20260803-n4q8|message' "$body" | head -20 || true
            rm -f "$body"
          done
