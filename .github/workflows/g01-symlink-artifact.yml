name: G01 symlink artifact source

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled symlink payload
        run: |
          rm -rf payload
          mkdir -p payload
          ln -s /etc/passwd payload/regular-from-symlink.txt
          printf "%s\n" "G01_SYMLINK_CONTROL_SENTINEL_20260803_A3" > payload/regular-control.txt
      - name: Upload symlink payload
        uses: actions/upload-artifact@v4
        with:
          name: g01-symlink-source-20260803-a3
          path: payload
